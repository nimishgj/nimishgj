<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Why resolving incidents is still slow: animated story</title>
<style>
:root{--bg:#ffffff;--ink:#57606a;--mut:#8b949e;--line:#d0d7de;--panel:#f6f8fa;
  --blue:#4a9ae1;--green:#2ea043;--red:#e5534b;--amber:#c69026}
:root[data-theme="dark"]{--bg:#202124;--ink:#c9d1d9;--mut:#8b949e;--line:#3d4144;--panel:#2a2b2e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:Helvetica,Arial,sans-serif;color:var(--ink);
  overflow:hidden;cursor:pointer;transition:background .3s ease}
#progress{position:absolute;top:0;left:0;height:3px;background:var(--blue);width:0%;z-index:5}
#clock{position:absolute;top:12px;right:14px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:15px;color:var(--mut);border:1px solid var(--line);border-radius:14px;
  padding:3px 12px;z-index:5;transition:opacity .4s}
#pauseflag{position:absolute;top:12px;left:14px;font-size:12px;color:var(--mut);opacity:0;z-index:5}
#stage{position:absolute;inset:0 0 58px 0}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;pointer-events:none}
.scene.active{opacity:1}
.scene svg{width:100%;height:100%;display:block}
#caption{position:absolute;left:0;right:0;bottom:0;height:58px;display:flex;
  align-items:center;justify-content:center;text-align:center;padding:0 24px;
  font-size:14.5px;line-height:1.4;color:var(--ink);opacity:1;transition:opacity .35s}
text{font-family:Helvetica,Arial,sans-serif;fill:var(--ink)}
.mut{fill:var(--mut)}.sm{font-size:12px}.xs{font-size:10.5px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.bx{fill:none;stroke:var(--mut);stroke-width:1.5}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1}
/* generic entrance anims, triggered when .active lands */
.active .pop{animation:pop .5s ease both}
.active .pop.d1{animation-delay:.3s}.active .pop.d2{animation-delay:.6s}
.active .pop.d3{animation-delay:.9s}.active .pop.d4{animation-delay:1.2s}
.active .pop.d5{animation-delay:1.5s}.active .pop.d6{animation-delay:1.8s}
.active .pop.d7{animation-delay:2.2s}.active .pop.d8{animation-delay:2.6s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.active .fade{animation:fade .8s ease both}
.active .fade.d2{animation-delay:.6s}.active .fade.d4{animation-delay:1.2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* scene 1 */
.active .type{animation:type 1.1s steps(1) infinite}
.active .type.t2{animation-delay:.35s}.active .type.t3{animation-delay:.7s}
@keyframes type{0%,49%{opacity:.35}50%,100%{opacity:1}}
.active .steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(0)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
/* scene 2 */
.active .shake{animation:shake .5s linear infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.active .ring{animation:ring 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.active .ring.r2{animation-delay:.4s}.active .ring.r3{animation-delay:.8s}
@keyframes ring{from{opacity:.8;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
/* scene 3 */
.active .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.active .grow{animation:grow .9s ease both;transform-box:fill-box;transform-origin:left center}
.active .grow.d2{animation-delay:.6s}.active .grow.d3{animation-delay:.85s}
.active .grow.d4{animation-delay:1.1s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* scene 4 */
.active .tabcyc{animation:tabcyc 6s linear infinite}
.active .tabcyc.c2{animation-delay:-4.5s}.active .tabcyc.c3{animation-delay:-3s}
.active .tabcyc.c4{animation-delay:-1.5s}
@keyframes tabcyc{0%,20%{fill-opacity:.16}25%,95%{fill-opacity:0}100%{fill-opacity:.16}}
/* scene 7 */
.active .flip{animation:flip 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes flip{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.active .dots{animation:dots 1.4s steps(1) infinite}
.active .dots.d2{animation-delay:.45s}.active .dots.d3{animation-delay:.9s}
@keyframes dots{0%,30%{opacity:.15}35%,100%{opacity:1}}
/* scene 8 */
.active .jit{animation:jit 3s ease-in-out infinite}
@keyframes jit{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
/* scene 9 */
.active .cmd{animation:cmd 1.4s steps(30) both}
@keyframes cmd{from{width:0}to{width:340px}}
.active .drop{stroke-dasharray:500;stroke-dashoffset:500;animation:drop 1.2s 1.6s ease forwards}
@keyframes drop{to{stroke-dashoffset:0}}
/* scene 10 */
.active .bar{animation:grow .8s ease both;transform-box:fill-box;transform-origin:left center}
.active .bar.b1{animation-delay:.3s}.active .bar.b2{animation-delay:.6s}
.active .bar.b3{animation-delay:.9s}.active .bar.b4{animation-delay:1.2s}
.active .bar.b5{animation-delay:1.5s}.active .bar.b6{animation-delay:1.8s}
.active .bar.b7{animation-delay:2.8s}.active .bar.b8{animation-delay:3.1s}
.active .pulse2{animation:pulse2 1.2s 3.8s ease infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .pop,.fade,.grow,.bar,.cmd{opacity:1!important}}
</style>
</head>

<div class="scene" data-caption="" data-clock="">
<svg viewBox="0 0 840 400">
  <text x="420" y="180" text-anchor="middle" class="fade" style="font-size:22px">Observability buys you the first six minutes.</text>
  <text x="420" y="220" text-anchor="middle" class="fade d2" style="font-size:22px">The rest you have to build.</text>
  <text x="420" y="290" text-anchor="middle" class="xs mut fade d4">click to replay from the top</text>
</svg>

</div>
<div id="caption"></div>
<script>
(function(){
  var scenes=[].slice.call(document.querySelectorAll('.scene'));
  var durs=[2.5,2,4,3.5,3.5,3.5,3.5,3.5,4,6.5,3].map(function(s){return s*1000});
  var total=durs.reduce(function(a,b){return a+b},0);
  var cap=document.getElementById('caption'),clock=document.getElementById('clock'),
      prog=document.getElementById('progress'),flag=document.getElementById('pauseflag');
  var i=-1,timer=null,sceneStart=0,remaining=0,paused=false,elapsedBefore=0;

  function setTheme(){
    var t=null;
    try{t=window.parent.document.documentElement.getAttribute('data-theme')}catch(e){}
    if(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';
    document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');
  }
  setTheme();setInterval(setTheme,1000);

  function show(n){
    scenes.forEach(function(s,k){s.classList.toggle('active',k===n)});
    var s=scenes[n];
    cap.style.opacity=0;
    setTimeout(function(){cap.textContent=s.getAttribute('data-caption');cap.style.opacity=1},250);
    var c=s.getAttribute('data-clock');
    clock.textContent=c;clock.style.opacity=c?1:0;
    elapsedBefore=durs.slice(0,n).reduce(function(a,b){return a+b},0);
    prog.style.transition='none';
    prog.style.width=(elapsedBefore/total*100)+'%';
    void prog.offsetWidth;
    prog.style.transition='width '+durs[n]+'ms linear';
    prog.style.width=((elapsedBefore+durs[n])/total*100)+'%';
  }
  function next(){
    i=(i+1)%scenes.length;
    show(i);
    sceneStart=Date.now();remaining=durs[i];
    timer=setTimeout(next,durs[i]);
  }
  document.body.addEventListener('click',function(){
    if(i===scenes.length-1){clearTimeout(timer);i=-1;next();return}
    if(!paused){
      paused=true;clearTimeout(timer);
      remaining-=Date.now()-sceneStart;
      var w=getComputedStyle(prog).width;
      prog.style.transition='none';prog.style.width=w;
      document.body.style.setProperty('--ps','paused');
      scenes[i].style.animationPlayState='paused';
      scenes[i].querySelectorAll('*').forEach(function(el){el.style.animationPlayState='paused'});
      flag.style.opacity=1;
    }else{
      paused=false;
      scenes[i].querySelectorAll('*').forEach(function(el){el.style.animationPlayState=''});
      sceneStart=Date.now();
      var pct=((elapsedBefore+(durs[i]-remaining))/total*100);
      prog.style.transition='none';prog.style.width=pct+'%';
      void prog.offsetWidth;
      prog.style.transition='width '+remaining+'ms linear';
      prog.style.width=((elapsedBefore+durs[i])/total*100)+'%';
      timer=setTimeout(next,remaining);
      flag.style.opacity=0;
    }
  });
  next();
})();
</script>
