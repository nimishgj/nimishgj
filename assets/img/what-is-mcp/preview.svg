<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" role="img" aria-label="An AI app talks through one MCP connection to many tools: github, a database and slack, with requests flowing to each in turn">
<style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#7d8590}
.sm{font-size:11px}
.bx{fill:none;stroke:#8b949e;stroke-width:1.5}
.ln{stroke:#8b949e;stroke-width:1.5;fill:none}
@keyframes q1{0%,2%{opacity:0;transform:translate(0,0)}4%{opacity:1}12%{opacity:1;transform:translate(210,0)}14%,100%{opacity:0}}
@keyframes a1{0%,14%{opacity:0;transform:translate(0,0)}16%{opacity:1}22%{opacity:1;transform:translate(190,-58)}24%,100%{opacity:0}}
@keyframes b1{0%,26%{opacity:0;transform:translate(0,0)}28%{opacity:1}34%{opacity:1;transform:translate(-190,58)}35%{opacity:1}42%{opacity:1;transform:translate(-400,58)}44%,100%{opacity:0}}
@keyframes q2{0%,48%{opacity:0;transform:translate(0,0)}50%{opacity:1}58%{opacity:1;transform:translate(210,0)}60%,100%{opacity:0}}
@keyframes a2{0%,60%{opacity:0;transform:translate(0,0)}62%{opacity:1}68%{opacity:1;transform:translate(190,0)}70%,100%{opacity:0}}
@keyframes b2{0%,72%{opacity:0;transform:translate(0,0)}74%{opacity:1}80%{opacity:1;transform:translate(-190,0)}81%{opacity:1}88%{opacity:1;transform:translate(-400,0)}90%,100%{opacity:0}}
.q1{animation:q1 13s linear infinite}.a1{animation:a1 13s linear infinite}.b1{animation:b1 13s linear infinite}
.q2{animation:q2 13s linear infinite}.a2{animation:a2 13s linear infinite}.b2{animation:b2 13s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="30" y="90" width="160" height="70" rx="8" class="bx"/>
<text x="110" y="120" text-anchor="middle">AI app</text>
<text x="110" y="140" text-anchor="middle" class="sm">(claude, your agent…)</text>
<line x1="192" y1="125" x2="338" y2="125" class="ln"/>
<rect x="340" y="97" width="120" height="56" rx="28" class="bx" stroke="#4a9ae1"/>
<text x="400" y="130" text-anchor="middle" fill="#4a9ae1">MCP</text>
<line x1="462" y1="112" x2="618" y2="62" class="ln"/>
<line x1="462" y1="125" x2="618" y2="125" class="ln"/>
<line x1="462" y1="138" x2="618" y2="188" class="ln"/>
<rect x="620" y="38" width="150" height="48" rx="7" class="bx"/>
<text x="695" y="67" text-anchor="middle" class="sm">github server</text>
<rect x="620" y="101" width="150" height="48" rx="7" class="bx"/>
<text x="695" y="130" text-anchor="middle" class="sm">database server</text>
<rect x="620" y="164" width="150" height="48" rx="7" class="bx"/>
<text x="695" y="193" text-anchor="middle" class="sm">slack server</text>
<circle class="q1" cx="200" cy="125" r="5.5" fill="#4a9ae1" opacity="0"/>
<circle class="a1" cx="470" cy="118" r="5.5" fill="#4a9ae1" opacity="0"/>
<circle class="b1" cx="660" cy="60" r="5.5" fill="#2ea043" opacity="0"/>
<circle class="q2" cx="200" cy="125" r="5.5" fill="#4a9ae1" opacity="0"/>
<circle class="a2" cx="470" cy="125" r="5.5" fill="#4a9ae1" opacity="0"/>
<circle class="b2" cx="660" cy="125" r="5.5" fill="#2ea043" opacity="0"/>
<text x="440" y="235" text-anchor="middle" class="sm">one protocol between the model and every tool</text>
</svg>
