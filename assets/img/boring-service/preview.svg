<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="A request flowing from client through load balancer, service and circuit breaker to a dependency, while the ten production-readiness practices get checked off below">
<style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#7d8590}
.sm{font-size:11px}
.bx{fill:none;stroke:#8b949e;stroke-width:1.5}
.ln{stroke:#8b949e;stroke-width:1.5;fill:none}
.chip{fill:none;stroke:#8b949e;stroke-width:1.2}
@keyframes flow{0%{opacity:0;transform:translateX(0)}3%{opacity:1}22%{opacity:1;transform:translateX(700)}25%,100%{opacity:0;transform:translateX(700)}}
.d1{animation:flow 12s linear infinite}
.d2{animation:flow 12s linear infinite 2.7s}
.d3{animation:flow 12s linear infinite 5.6s}
.d4{animation:flow 12s linear infinite 8.9s}
@keyframes rej{0%,40%{opacity:0;transform:translateX(0)}42%{opacity:1;fill:#4a9ae1}47%{transform:translateX(120);fill:#4a9ae1}49%{fill:#e5534b}55%{opacity:1;transform:translateX(40);fill:#e5534b}58%,100%{opacity:0}}
.rej{animation:rej 12s linear infinite}
@keyframes r429{0%,45%{opacity:0}49%,58%{opacity:1}62%,100%{opacity:0}}
.r429{animation:r429 12s linear infinite;fill:#e5534b;font-size:11px}
@keyframes tick{0%{opacity:0}8%,96%{opacity:1}100%{opacity:0}}
.t1{animation:tick 12s linear infinite .3s}
.t2{animation:tick 12s linear infinite 1.3s}
.t3{animation:tick 12s linear infinite 2.3s}
.t4{animation:tick 12s linear infinite 3.3s}
.t5{animation:tick 12s linear infinite 4.3s}
.t6{animation:tick 12s linear infinite 5.3s}
.t7{animation:tick 12s linear infinite 6.3s}
.t8{animation:tick 12s linear infinite 7.3s}
.t9{animation:tick 12s linear infinite 8.3s}
.t10{animation:tick 12s linear infinite 9.3s}
.tick{fill:#2ea043;font-size:12px;font-weight:bold}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="20" y="60" width="90" height="46" rx="7" class="bx"/>
<text x="65" y="88" text-anchor="middle">client</text>
<line x1="112" y1="83" x2="168" y2="83" class="ln"/>
<rect x="170" y="60" width="120" height="46" rx="7" class="bx"/>
<text x="230" y="88" text-anchor="middle">load balancer</text>
<line x1="292" y1="83" x2="348" y2="83" class="ln"/>
<rect x="350" y="38" width="200" height="90" rx="7" class="bx"/>
<text x="450" y="62" text-anchor="middle">service</text>
<rect x="372" y="76" width="34" height="20" rx="3" class="chip"/>
<rect x="416" y="76" width="34" height="20" rx="3" class="chip"/>
<rect x="460" y="76" width="34" height="20" rx="3" class="chip"/>
<text x="450" y="115" text-anchor="middle" class="sm">timeout: 2s · retry ×3</text>
<line x1="552" y1="83" x2="620" y2="83" class="ln"/>
<circle cx="626" cy="83" r="3.5" fill="#8b949e"/>
<line x1="626" y1="83" x2="668" y2="83" stroke="#8b949e" stroke-width="2.4"/>
<circle cx="674" cy="83" r="3.5" fill="#8b949e"/>
<text x="650" y="108" text-anchor="middle" class="sm">breaker</text>
<line x1="676" y1="83" x2="738" y2="83" class="ln"/>
<rect x="740" y="60" width="120" height="46" rx="7" class="bx"/>
<text x="800" y="88" text-anchor="middle">dependency</text>
<circle class="d1" cx="120" cy="83" r="5.5" fill="#2ea043" opacity="0"/>
<circle class="d2" cx="120" cy="83" r="5.5" fill="#2ea043" opacity="0"/>
<circle class="d3" cx="120" cy="83" r="5.5" fill="#2ea043" opacity="0"/>
<circle class="d4" cx="120" cy="83" r="5.5" fill="#2ea043" opacity="0"/>
<circle class="rej" cx="118" cy="68" r="5.5" opacity="0"/>
<text x="255" y="52" class="r429" opacity="0">429</text>
<line x1="20" y1="150" x2="860" y2="150" stroke="#8b949e" stroke-width="1" stroke-opacity=".4"/>
<g>
  <rect x="20" y="170" width="160" height="28" rx="14" class="chip"/>
  <text x="88" y="189" text-anchor="middle" class="sm">graceful shutdown</text>
  <text x="42" y="189" class="tick t1" opacity="0">✓</text>
  <rect x="192" y="170" width="130" height="28" rx="14" class="chip"/>
  <text x="266" y="189" text-anchor="middle" class="sm">health checks</text>
  <text x="212" y="189" class="tick t2" opacity="0">✓</text>
  <rect x="334" y="170" width="110" height="28" rx="14" class="chip"/>
  <text x="398" y="189" text-anchor="middle" class="sm">timeouts</text>
  <text x="352" y="189" class="tick t3" opacity="0">✓</text>
  <rect x="456" y="170" width="160" height="28" rx="14" class="chip"/>
  <text x="528" y="189" text-anchor="middle" class="sm">retries + backoff</text>
  <text x="474" y="189" class="tick t4" opacity="0">✓</text>
  <rect x="628" y="170" width="130" height="28" rx="14" class="chip"/>
  <text x="702" y="189" text-anchor="middle" class="sm">idempotency</text>
  <text x="646" y="189" class="tick t5" opacity="0">✓</text>
</g>
<g>
  <rect x="20" y="212" width="140" height="28" rx="14" class="chip"/>
  <text x="98" y="231" text-anchor="middle" class="sm">request ids</text>
  <text x="40" y="231" class="tick t6" opacity="0">✓</text>
  <rect x="172" y="212" width="160" height="28" rx="14" class="chip"/>
  <text x="260" y="231" text-anchor="middle" class="sm">structured logs</text>
  <text x="192" y="231" class="tick t7" opacity="0">✓</text>
  <rect x="344" y="212" width="130" height="28" rx="14" class="chip"/>
  <text x="416" y="231" text-anchor="middle" class="sm">rate limits</text>
  <text x="362" y="231" class="tick t8" opacity="0">✓</text>
  <rect x="486" y="212" width="160" height="28" rx="14" class="chip"/>
  <text x="574" y="231" text-anchor="middle" class="sm">circuit breakers</text>
  <text x="504" y="231" class="tick t9" opacity="0">✓</text>
  <rect x="658" y="212" width="160" height="28" rx="14" class="chip"/>
  <text x="746" y="231" text-anchor="middle" class="sm">safe migrations</text>
  <text x="676" y="231" class="tick t10" opacity="0">✓</text>
</g>
<text x="440" y="278" text-anchor="middle" class="sm" fill-opacity=".8">the boring checklist, before production</text>
</svg>
