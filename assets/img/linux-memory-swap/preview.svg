<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-label="RAM fills with memory pages; as it gets full, inactive pages move out to swap on disk, freeing room for new ones">
<style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#7d8590}
.sm{font-size:11px}
.bx{fill:none;stroke:#8b949e;stroke-width:1.5}
.pg{stroke:#8b949e;stroke-width:1}
@keyframes fill1{0%,6%{fill-opacity:0}10%,100%{fill-opacity:.5}}
@keyframes fill2{0%,14%{fill-opacity:0}18%,100%{fill-opacity:.5}}
@keyframes fill3{0%,22%{fill-opacity:0}26%,100%{fill-opacity:.5}}
.f1{animation:fill1 13s linear infinite;fill:#4a9ae1}
.f2{animation:fill2 13s linear infinite;fill:#4a9ae1}
.f3{animation:fill3 13s linear infinite;fill:#4a9ae1}
@keyframes cold{0%,30%{fill:#4a9ae1;fill-opacity:.5}36%,44%{fill:#c69026;fill-opacity:.5}46%,100%{fill-opacity:0;fill:#c69026}}
.cold1{animation:cold 13s linear infinite}
.cold2{animation:cold 13s linear infinite .5s}
@keyframes mv{0%,44%{opacity:0;transform:translate(0,0)}46%{opacity:1}62%{opacity:1;transform:translate(315,0)}64%,100%{opacity:0;transform:translate(315,0)}}
.mv1{animation:mv 13s linear infinite}
.mv2{animation:mv 13s linear infinite .6s}
@keyframes swapin{0%,62%{fill-opacity:0}66%,100%{fill-opacity:.5}}
.sw1{animation:swapin 13s linear infinite;fill:#c69026}
.sw2{animation:swapin 13s linear infinite .6s;fill:#c69026}
@keyframes fresh{0%,70%{fill-opacity:0}75%,100%{fill-opacity:.5}}
.fr1{animation:fresh 13s linear infinite;fill:#2ea043}
.fr2{animation:fresh 13s linear infinite .8s;fill:#2ea043}
@keyframes note{0%,42%{opacity:0}48%,88%{opacity:1}94%,100%{opacity:0}}
.note{animation:note 13s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="120" y="45" width="220" height="150" rx="8" class="bx"/>
<text x="230" y="34" text-anchor="middle" class="sm">RAM</text>
<rect x="140" y="65" width="55" height="35" rx="4" class="pg" fill="#4a9ae1" fill-opacity=".5"/>
<rect x="205" y="65" width="55" height="35" rx="4" class="pg" fill="#4a9ae1" fill-opacity=".5"/>
<rect x="270" y="65" width="55" height="35" rx="4" class="pg f1" fill-opacity="0"/>
<rect x="140" y="110" width="55" height="35" rx="4" class="pg f2" fill-opacity="0"/>
<rect x="205" y="110" width="55" height="35" rx="4" class="pg f3" fill-opacity="0"/>
<rect x="270" y="110" width="55" height="35" rx="4" class="pg cold1"/>
<rect x="140" y="155" width="55" height="35" rx="4" class="pg cold2"/>
<rect x="205" y="155" width="55" height="35" rx="4" class="pg fr1" fill-opacity="0"/>
<rect x="270" y="155" width="55" height="35" rx="4" class="pg fr2" fill-opacity="0"/>
<rect class="mv1" x="270" y="110" width="55" height="35" rx="4" fill="#c69026" fill-opacity=".5" stroke="#c69026" opacity="0"/>
<rect class="mv2" x="140" y="155" width="55" height="35" rx="4" fill="#c69026" fill-opacity=".5" stroke="#c69026" opacity="0"/>
<line x1="360" y1="120" x2="560" y2="120" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="5 5"/>
<text x="460" y="108" text-anchor="middle" class="sm note" opacity="0">inactive pages swapped out</text>
<rect x="580" y="45" width="220" height="150" rx="8" class="bx" stroke-dasharray="7 5"/>
<text x="690" y="34" text-anchor="middle" class="sm">swap (disk)</text>
<rect x="600" y="110" width="55" height="35" rx="4" class="pg sw1" fill-opacity="0"/>
<rect x="600" y="155" width="55" height="35" rx="4" class="pg sw2" fill-opacity="0"/>
<text x="440" y="228" text-anchor="middle" class="sm">RAM stays free for what is actually being used</text>
</svg>
