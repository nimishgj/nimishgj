<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" role="img" aria-label="Load rises on a meter, the horizontal pod autoscaler adds pods, then removes them as load falls">
<style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#7d8590}
.sm{font-size:11px}
.bx{fill:none;stroke:#8b949e;stroke-width:1.5}
@keyframes lvl{0%{transform:scaleY(.25)}35%{transform:scaleY(.92)}55%{transform:scaleY(.92)}85%{transform:scaleY(.3)}100%{transform:scaleY(.25)}}
.lvl{animation:lvl 14s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes hot{0%,20%{fill:#4a9ae1}30%,60%{fill:#e5534b}75%,100%{fill:#4a9ae1}}
.lvlc{animation:hot 14s linear infinite}
@keyframes cpuLo{0%,24%{opacity:1}28%,68%{opacity:0}74%,100%{opacity:1}}
@keyframes cpuHi{0%,24%{opacity:0}28%,68%{opacity:1}74%,100%{opacity:0}}
.cpulo{animation:cpuLo 14s linear infinite}
.cpuhi{animation:cpuHi 14s linear infinite}
@keyframes p3{0%,30%{opacity:0;transform:scale(.6)}34%,76%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(.6)}}
@keyframes p4{0%,38%{opacity:0;transform:scale(.6)}42%,82%{opacity:1;transform:scale(1)}86%,100%{opacity:0;transform:scale(.6)}}
@keyframes p5{0%,46%{opacity:0;transform:scale(.6)}50%,88%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(.6)}}
.p3{animation:p3 14s linear infinite;transform-box:fill-box;transform-origin:center}
.p4{animation:p4 14s linear infinite;transform-box:fill-box;transform-origin:center}
.p5{animation:p5 14s linear infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<text x="70" y="36" text-anchor="middle" class="sm">load</text>
<rect x="50" y="50" width="40" height="140" rx="5" class="bx"/>
<rect x="53" y="53" width="34" height="134" class="lvl lvlc" fill="#4a9ae1" fill-opacity=".55"/>
<text x="70" y="212" text-anchor="middle" class="sm cpulo">cpu 40%</text>
<text x="70" y="212" text-anchor="middle" class="sm cpuhi" opacity="0">cpu 85%</text>
<line x1="110" y1="120" x2="196" y2="120" stroke="#8b949e" stroke-width="1.5"/>
<rect x="200" y="90" width="110" height="60" rx="8" class="bx"/>
<text x="255" y="115" text-anchor="middle">HPA</text>
<text x="255" y="135" text-anchor="middle" class="sm">watches metrics</text>
<line x1="312" y1="120" x2="398" y2="120" stroke="#8b949e" stroke-width="1.5"/>
<rect x="400" y="40" width="440" height="160" rx="8" class="bx" stroke-dasharray="6 5"/>
<text x="620" y="30" text-anchor="middle" class="sm">deployment</text>
<rect x="430" y="90" width="70" height="60" rx="7" class="bx" stroke="#2ea043"/>
<text x="465" y="125" text-anchor="middle" class="sm" fill="#2ea043">pod</text>
<rect x="512" y="90" width="70" height="60" rx="7" class="bx" stroke="#2ea043"/>
<text x="547" y="125" text-anchor="middle" class="sm" fill="#2ea043">pod</text>
<g class="p3" opacity="0">
  <rect x="594" y="90" width="70" height="60" rx="7" class="bx" stroke="#2ea043"/>
  <text x="629" y="125" text-anchor="middle" class="sm" fill="#2ea043">pod</text>
</g>
<g class="p4" opacity="0">
  <rect x="676" y="90" width="70" height="60" rx="7" class="bx" stroke="#2ea043"/>
  <text x="711" y="125" text-anchor="middle" class="sm" fill="#2ea043">pod</text>
</g>
<g class="p5" opacity="0">
  <rect x="758" y="90" width="70" height="60" rx="7" class="bx" stroke="#2ea043"/>
  <text x="793" y="125" text-anchor="middle" class="sm" fill="#2ea043">pod</text>
</g>
<text x="620" y="232" text-anchor="middle" class="sm">scale out when load climbs, back in when it settles</text>
</svg>
